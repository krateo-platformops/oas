apiVersion: v1
kind: ConfigMap
metadata:
  name: refund-oas
data:
  openapi.yaml: |
    openapi: 3.0.0
    info: { title: Refund API, version: 1.0.0 }
    paths:
      /refunds:
        post:
          operationId: createRefund
          requestBody:
            content:
              application/json:
                schema: { $ref: '#/components/schemas/Refund' }
          responses: { '201': { description: created } }
      /refunds/{id}:
        get:
          operationId: getRefund
          parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
          responses: { '200': { description: ok } }
        delete:
          operationId: deleteRefund
          parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
          responses: { '204': { description: deleted } }
    components:
      schemas:
        Refund:
          type: object
          properties:
            id: { type: string }
            amount: { type: integer }
